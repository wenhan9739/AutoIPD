version: "3.8"

services:
  autoipd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: autoipd
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MINERU_API_KEY=${MINERU_API_KEY}
      - IPDR_ROOT=/data
      - MAX_CONTENT_LENGTH=100MB
    volumes:
      - autoipd_data:/data
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: autoipd-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - autoipd

volumes:
  autoipd_data:
