# HTTP：ACME 质询 + 全部跳转 HTTPS
server {
    listen 80;
    server_name www.magpieagent.online magpieagent.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：TLS 终止 + 反代 Flask
server {
    listen 443 ssl;
    http2 on;
    server_name www.magpieagent.online magpieagent.online;

    ssl_certificate     /etc/letsencrypt/live/www.magpieagent.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.magpieagent.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    location / {
        proxy_pass http://autoipd:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
